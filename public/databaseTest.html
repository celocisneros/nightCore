<!DOCTYPE html>
<html>
<head>
    <style>
@font-face {
            font-family: 'dungeon';
            src: url('dungeon.ttf');
        }
body{
    display: flex;
    flex-direction: column;
    gap: 30px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    background-color: black;
    align-items: center;
    text-align: center;
    justify-content: center;
    color: silver;
    margin-top: 5px;
}
button {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 30px;
    background-color: silver;
    color: black;
}
#databaseBox{
    color: black;
    border: solid 3px silver;
    width: fit-content;
    padding: 50px;
    height: fit-content;
    font-size: 30px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}
#databaseResponse{
    color: silver;
}
h1{
    font-size: 30px;
    margin-top: -100px;
}
#logo{
    scale: 50%;
    margin-top: -100px;
}
    </style>
</head>
<body>
    <img id="logo" src="nightCoreLogo.jpeg">
<h1>nightCore database testing</h1>

<button onclick="loadMessage()">check connection to nightCore database</button>
<button onclick="loadUser()">check current users inside database</button>

<div id="databaseBox">
<p id="databaseResponse">click a button for database response in this box</p>
</div>

<button style="margin-bottom: 100px;" onclick="window.location.href='index.html'">go back home</button>

<script>
  async function loadMessage() {
    const res = await fetch('/api/system/connected');
    const text = await res.text();
    document.getElementById('databaseResponse').textContent = text.message;
  }
  async function loadUser(){
    const res = await fetch('/api/displayUser');
    const text = await res.text();
    document.getElementById('databaseResponse').textContent = text.name;
  }
</script>

</body>
</html>
