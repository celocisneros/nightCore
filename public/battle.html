<!DOCTYPE html>
<html>
    <head>
<link rel="stylesheet" href="css/battle.css">
    </head>
<body>
<div id="turnBox">
    <span id="battleTurn">battle turn</span>
</div>

<div id="battleContainer">

<div id="playerBox">
    <img id="profilePic" src="" width="100"/>
<div id="playerStats"></div>
</div> <!--end of player box-->

<div id="enemyBox">
<div id="enemyStats"></div>
</div> <!--end of enemy box-->

</div> <!--end of battle container-->

<pre id="battleLog">battle has not been started..</pre>

<div id="choiceBox">
    <button id="attackBtn">attack</button>
    <button>magic</button>
    <button>item</button>
    <button id="enemyTurnBtn">done</button>
</div>
<button onclick="loadMonster(bat)">bat</button>
<button onclick="window.location.href='dashboard.html'">go back to dashboard</button>

<script>
    async function getPlayer() {
        //this fetches from the playerRoutes api current user to grab player object
        const res = await fetch("/api/current-user");
        const data = await res.json();
        const player = data.player;
        //place the current players profile picture into the player box div
        document.getElementById('profilePic').src = player.profilePicPath;
        //place the current player username into the playerStats div
        document.getElementById('playerStats').textContent = `Player: ${player.username}`;
        console.log(`now logging the current player object`);
        console.log(player);
    }
    getPlayer();


</script>
<script src="javascript/monsterLogic.js"></script>

</body>
</html>
