<!DOCTYPE html>
<html>
    <head>
<link rel="stylesheet" href="battle.css">
    </head>
<body>
<div id="turnBox">
    <span id="battleTurn">battle turn</span>
</div>

<div id="battleContainer">

<div id="playerBox">
<div id="playerStats"></div>
</div> <!--end of player box-->

<div id="enemyBox">
<div id="enemyStats"></div>
</div> <!--end of enemy box-->

</div> <!--end of battle container-->

<pre id="battleLog">battle has not been started..</pre>

<div id="choiceBox">
    <button id="attackBtn">attack</button>
    <button>magic</button>
    <button>item</button>
    <button id="enemyTurnBtn">done</button>
</div>

<button onclick="window.location.href='dashboard.html'">go back to dashboard</button>

<script>
    async function getPlayer() {
        const res = await fetch("/api/current-user");
        const data = await res.json();
        const player = data.player;
        document.getElementById('playerStats').textContent = `Player: ${player.username}`;
    }
    getPlayer();
</script>

</body>
</html>
