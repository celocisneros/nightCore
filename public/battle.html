<!DOCTYPE html>
<html>
    <head>
<link rel="stylesheet" href="css/battle.css">
    </head>
<body>
    <div id="turnContainer"></div>

<div id="battleContainer">
        <div id="playerBox">
            <img id="playerPicture">
            <span id="playerName"></span>
        </div>

        <div id="enemyBox">
            <img id="enemyPicture">
            <span id="enemyName"></span>
        </div>
</div>

    <pre id="battleLog"></pre>

    <div id="choiceContainer">
    <button>attack</button>
    <button>item</button>
    <button>bag</button>
    <button>run</button>
    </div>

    <script>
        //default ui script to fill in screen with something
        document.getElementById('playerName').textContent = "player name";
        document.getElementById('enemyName').textContent = "enemy name"
        document.getElementById('playerPicture').src = "newLogo.png"
        document.getElementById('enemyPicture').src = "newLogo.png"
        document.getElementById('battleLog').textContent = "battle not started";

    </script>
</body>
</html>
