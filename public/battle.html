<!DOCTYPE html>
<html>
    <head>
<link rel="stylesheet" href="battle.css">
    </head>
<body>
<div id="turnBox">
    <span id="battleTurn">battle turn</span>
</div>

<pre id="battleLog"></pre>

<div id="battleContainer">

<div id="playerBox">
<div id="playerStats"></div>
</div> <!--end of player box-->

<div id="enemyBox">
<div id="enemyStats"></div>
</div> <!--end of enemy box-->

</div> <!--end of battle container-->

<div id="choiceBox">
    <button id="attackBtn">attack</button>
    <button>magic</button>
    <button>item</button>
    <button id="enemyTurnBtn">done</button>
</div>

<script>
    async function getBattle() {
  const res = await fetch("http://52.186.84.191:3000/battle");
  const battle = await res.json();

  // Update the screen with stats
  document.getElementById("playerStats").textContent =
    `${battle.player.name} - HP: ${battle.player.hp}`;
  document.getElementById("enemyStats").textContent =
    `${battle.enemy.name} - HP: ${battle.enemy.hp}`;
}

document.getElementById("attackBtn").addEventListener("click", async () => {
  const res = await fetch("http://localhost:3000/battle/attack", {
    method: "POST"
  });
  const data = await res.json();

  // Show result message
  document.getElementById("battleLog").textContent = data.result;

  // Refresh stats on screen
  getBattle();
});

document.getElementById("enemyTurnBtn").addEventListener("click", async () => {
  const res = await fetch("http://localhost:3000/battle/enemy-turn", {
    method: "POST"
  });
  const data = await res.json();

  // Show result
  document.getElementById("battleLog").textContent = data.result;

  // Refresh stats
  getBattle();
});

getBattle();
</script>

</body>
</html>
