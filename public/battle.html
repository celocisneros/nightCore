<!DOCTYPE html>
<html>
    <head>
<link rel="stylesheet" href="battle.css">
    </head>
<body>
<div id="turnBox">
    <span id="battleTurn">battle turn</span>
</div>

<div id="battleContainer">

<div id="playerBox">
    <span id="playerName">player</span>
    <p>HP:<span id="playerHP">100</span></p>
    <p>MP:<span id="playerMP">100</span></p>
</div> <!--end of player box-->

<div id="enemyBox">
    <span id="enemyName">enemy</span>
    <p>HP:<span id="enemyHP">100</span></p>
    <p>MP:<span id="enemyMP">100</span></p>
</div> <!--end of enemy box-->

</div> <!--end of battle container-->

<div id="choiceBox">
    <button>attack</button>
    <button>magic</button>
    <button>item</button>
    <button>run</button>
</div>



</body>
</html>
