<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <h1>Welcome to Your Dashboard</h1>

  <img id="profilePic" width="150">

<div id="profile">
</div>

<div id="dashNav">
  <a href="dashboard">dashboard</a>
  <a href="battle.html">battle</a>
  <a href="train.html">train</a>
  <a href="logout">logout</a>
</div>

<input type="text" id="profilePicUrlInput" placeholder="Enter image URL">
<button id="updatePicBtn">Update Profile Picture</button>


<script>
async function loadProfile() {
  try {
    const res = await fetch("/api/current-user");
    const data = await res.json();

    if (!data.player) {
      document.getElementById("profile").innerText = "Not logged in.";
      return;
    }

    // Example: show username + stats
    const player = data.player;
    document.getElementById("profile").innerHTML = `
      <h3>${player.username}'s Profile</h3>
      <p>Level: ${player.level}</p>
      <p>XP: ${player.xp}</p>
      <p>HP: ${player.hp}</p>
    `;
  } catch (err) {
    console.error("Error loading profile:", err);
  }
}

loadProfile();

//to update profile pic with players own url
async function updateProfilePic(url) {
  const res = await fetch("/api/update-profile-pic-url", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ profilePicUrl: url }),
    credentials: "include"  // 🔥 this is critical
  });

  const data = await res.json();
  console.log(data);
}

// attach it to the button
document.getElementById("updatePicBtn").addEventListener("click", () => {
  const newUrl = document.getElementById("ProfilePicUrlInput").value;
  if (newUrl.trim()) {
    updateProfilePic(newUrl);
  }
});

</script>


</body>
</html>
