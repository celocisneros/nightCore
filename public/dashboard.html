<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <h1>Welcome to Your Dashboard</h1>

  <!-- This will display the current logged-in username -->
  <p id="currentUser">Loading...</p>

<div id="centerContainer">

<div id="miniProfile">
  <p id="miniProfileData"></p>
</div> <!-- end of mini profile div-->

</div> <!-- end of center container-->

  <script>
    // Fetch the current logged-in player from backend
    async function loadPlayer() {
      try {
        const response = await fetch("http://52.186.84.191:3000/api/current-player");
        if (!response.ok) {
          // If not logged in, redirect to login page
          window.location.href = "login.html";
          return;
        }

        const data = await response.json();

        // Display username on page
        document.getElementById("currentUser").innerText = 
          "Logged in as: " + data.player.username;

          document.getElementById("miniProfileData").textContent = data.player.username;

      } catch (err) {
        console.error("Error fetching player:", err);
        document.getElementById("currentUser").innerText = "Error loading player info";
      }
    }

    // Call function on page load
    loadPlayer();
  </script>
</body>
</html>
