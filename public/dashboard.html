<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <h1>Welcome to Your Dashboard</h1>

<div id="profile">
  <img id="profilePic">
</div>

<form id="profilePicForm" enctype="multipart/form-data">
  <input type="file" name="profilePic" id="profilePicInput" />
  <button type="submit">Update Profile Picture</button>
</form>

<div id="dashNav">
  <a href="dashboard">dashboard</a>
  <a href="battle.html">battle</a>
  <a href="train.html">train</a>
  <a href="logout">logout</a>
</div>

<script>
async function loadProfile() {
  try {
    const res = await fetch("/api/current-user");
    const data = await res.json();

    if (!data.player) {
      document.getElementById("profile").innerText = "Not logged in.";
      return;
    }

    // Example: show username + stats
    const player = data.player;
    document.getElementById("profile").innerHTML = `
      <h3>${player.username}'s Profile</h3>
      <p>Level: ${player.level}</p>
      <p>XP: ${player.xp}</p>
      <p>HP: ${player.hp}</p>
    `;
  } catch (err) {
    console.error("Error loading profile:", err);
  }
}

async function loadProfilePicture(){
  try {
    const res = await fetch("/api/current-user");
    const data = await res.json();
    if (data.player) {
      document.getElementById("profilePic").src = data.player.profilePicUrl;
    }
    else {
      document.getElementById("profilePic").src = ""; //clear img if logged out
    }
   } catch (err) {
      console.error("Error loading current user:", err);
    }
  }
loadProfile();
</script>


</body>
</html>
