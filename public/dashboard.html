<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <h1>Welcome to Your Dashboard</h1>

  <img id="profilePic" alt="Profile Picture" width="150" height="150" />

<div id="profile">
</div>

<div id="dashNav">
  <a href="dashboard">dashboard</a>
  <a href="battle.html">battle</a>
  <a href="train.html">train</a>
  <a href="logout">logout</a>
</div>

<input type="file" id="profileUpload" accept="image/*" />
<button id="uploadBtn">Upload Profile Pic</button>

<script>
async function loadProfile() {
  try {
    const res = await fetch("/api/current-user");
    const data = await res.json();

    if (!data.player) {
      document.getElementById("profile").innerText = "Not logged in.";
      return;
    }

    // Example: show username + stats
    const player = data.player;
    document.getElementById("profile").innerHTML = `
      <h3>${player.username}'s Profile</h3>
      <p>Level: ${player.level}</p>
      <p>XP: ${player.xp}</p>
      <p>HP: ${player.hp}</p>
    `;
  } catch (err) {
    console.error("Error loading profile:", err);
  }
}

loadProfile();

//upload and convert image to base 64 string and send to api to save in mongo db
document.getElementById("uploadBtn").addEventListener("click", async () => {
  const fileInput = document.getElementById("profileUpload");
  const file = fileInput.files[0];
  if (!file) return alert("Please select a file");

  const reader = new FileReader();
  reader.onloadend = async () => {
    const base64Image = reader.result; // <-- this is the Base64 string

    // Send it to backend
    await fetch("/api/update-profile-pic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ profilePic: base64Image })
    });

    alert("Profile picture updated!");
  };

  reader.readAsDataURL(file); // converts file to Base64
});

async function loadProfilePic() {
  const res = await fetch("/api/current-user");
  const data = await res.json();

  if (data.player && data.player.profilePic) {
    document.getElementById("profilePic").src = data.player.profilePic;
  } else {
    document.getElementById("profilePic").src = ""; // fallback
  }
}

loadProfilePic();

</script>


</body>
</html>
