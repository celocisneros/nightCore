<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <h2>Welcome to Your Dashboard</h2>

<img id="profilePic" src="" alt="Profile Picture" />


<div id="profile">
</div>

<div id="dashNav">
  <a href="dashboard">dashboard</a>
  <a href="battle.html">battle</a>
  <a href="train.html">train</a>
  <a onclick="logout()">logout</a>
</div>

<div id="options">
<input type="file" id="uploadPic" />
<button id="updatePicBtn">Update Profile Pic</button>
<button id="deleteBtn">Delete Account</button>
</div>

<script>
async function loadProfile() {
  try {
    const res = await fetch("/api/current-user");
    const data = await res.json();
    if (!data.player) {
      document.getElementById("profile").innerText = "Not logged in.";
      return;
    }

//creates a variable named player from the player object we fetched
    const player = data.player;
    
    document.getElementById("profile").innerHTML = 
    `profile <br> 
    username: ${player.username}<br>
    level: ${player.level}<br> 
    hp: ${player.hp}<br>
    yen: ${player.yen}<br> 
    xp: ${player.xp}<br>
    attack: ${player.attack}<br>
    defense: ${player.defense}`;
    console.log(`now logging the current player object to the console`);
    console.log(player);
  } catch (err) {
    console.error("Error loading profile:", err);
  }
}

loadProfile();

//this sends the file you upload to the uploads folder and saves the path in the current users player object in the database
document.getElementById('updatePicBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('uploadPic');
  const file = fileInput.files[0];
  if (!file) return alert('Select an image first!');

  const formData = new FormData();
  formData.append('profilePic', file);

  const res = await fetch('/api/update-profile-pic', {
    method: 'POST',
    body: formData
  });

  const data = await res.json();

  if (data.success) {
    document.getElementById('profilePic').src = data.profilePicPath;
  } else {
    alert(data.error);
  }
});


async function loadProfilePic() {
  try {
    const res = await fetch("/api/current-user");
    const data = await res.json();

    if (!data.player) {
      document.getElementById("profile").innerText = "Not logged in.";
      return;
    }

    // Example: show username + stats
    const player = data.player;
    document.getElementById("profilePic").src = player.profilePicPath;
  } catch (err) {
    console.error("Error loading profile picture:", err);
  }
}

loadProfilePic();

//this is to logout the current player
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/login.html"; // redirect to login
}

//this will be to delete player and account and logout
  document.getElementById("deleteBtn").addEventListener("click", async () => {
    if (!confirm("Are you sure you want to delete your account?")) return;

    const res = await fetch("/api/player-delete", { method: "DELETE", credentials: "include" });


    if (res.ok) {
      alert("Account deleted.");
      window.location.href = "/register.html"; // or wherever you want to redirect
    } else {
      const data = await res.json();
      alert("Error: " + data.message);
    }
  });
</script>


</body>
</html>
