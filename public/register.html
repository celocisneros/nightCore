<!DOCTYPE html>
<html>
    <head>
<link rel="stylesheet" href="css/register.css">
    </head>
<body>
<h1>please create a new nightcore player</h1>
    <form id="registerForm">
    <label>Username:</label><br>
<input type="text" id="username" required><br><br>
    <label>Password:</label><br>
<input type="password" id="password" required><br><br>
    <label>Email:</label><br>
<input type="email" id="email" required><br><br>

<button type="submit">register</button>
</form>

<p id="message"></p> <!--this will show success or error message-->

<script>
//grab the form element
const form = document.getElementById('registerForm');

//attach an event listener for when the form is submitted
form.addEventListener("submit", async (e) => {
    e.preventDefault();
//collect input values
const username = document.getElementById("username").value;
const password = document.getElementById("password").value;
const email = document.getElementById("email").value;

//send data to backend using fetch post
try{
const response = await fetch("http://52.186.84.191:3000/api/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password, email })
});

const data = await response.json();

//show backend message in the "message" p element
document.getElementById('message').textContent = data.message;
} //end of try block
catch (err) {
    document.getElementById('message').textContent = "Error: " + err.message;
}

}); //end of the async function


</script>


</body>
</html>
